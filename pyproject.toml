[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "canonkeeper"
version = "0.1.0"
description = "Series-continuity engine for long-running fiction: give it the whole series, it finds the contradictions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nolan Kido" }]
keywords = ["fiction", "continuity", "series-bible", "llm", "meta-model-api", "muse"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "openai>=1.50",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "jinja2>=3.1",
  "rapidfuzz>=3.9",
  "tiktoken>=0.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
  "httpx>=0.27",
]

[project.scripts]
canonkeeper = "canonkeeper.cli:app"

[project.urls]
Homepage = "https://github.com/nolankido/canonKeeper"
Issues = "https://github.com/nolankido/canonKeeper/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/canonkeeper"]

[tool.hatch.build.targets.wheel.force-include]
"src/canonkeeper/preflight/templates" = "canonkeeper/preflight/templates"
"src/canonkeeper/report/templates" = "canonkeeper/report/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["canonkeeper"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
