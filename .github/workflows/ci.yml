name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest --cov=canonkeeper --cov-report=term-missing
        env:
          CANONKEEPER_PROVIDER: mock

  windows:
    # The maintainer works on Windows; line endings and paths differ there (a \r\n regression
    # once passed on Linux and failed only on Windows).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          CANONKEEPER_PROVIDER: mock  # default cp1252 locale on purpose: as users run it
